name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  # release.yml lo reutiliza para no publicar nada sin pasar los tests
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Los tests no usan Electron; así npm ci no descarga su binario
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Los tests del rellenado usan el Google Chrome que trae el runner
      - run: npm test
